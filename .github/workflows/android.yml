name: Build

# Produces a downloadable debug APK for every push, so a build can be fetched
# from the Actions tab without anyone having to build locally. Also runs the
# test suites the repo already has, which nothing was executing in CI before.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the release step below needs write access to attach the
# APK to a tag, and without this it fails on repos whose default token is
# read-only.
permissions:
  contents: write

jobs:
  native-tests:
    name: Native C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S app/src/main/cpp -B build-test -DSTANDALONE_TEST=ON

      - name: Build
        run: cmake --build build-test --parallel

      - name: Test
        working-directory: build-test
        run: ctest --output-on-failure --parallel 4

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        # Pinned to the version app/build.gradle.kts requests, so CI and a local
        # Termux build produce the same native binary.
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug APK
        # `clean` first: incremental packaging has been observed to leave stale
        # padding in the APK, inflating it several-fold. A clean assemble keeps
        # the shipped size honest.
        run: ./gradlew clean :app:assembleDebug --no-daemon

      - name: Verify the APK is signed and carries the arm64 engine
        # A debug APK that is unsigned, or missing the native library, installs
        # or launches but cannot play anything. Both are cheap to assert here.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$BT/apksigner" verify "$APK"
          echo "signature: OK"

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libbitperfect_engine.so'
          echo "native engine present: OK"

          # The USB transport must be the real usbdevfs one, not the non-Linux
          # stub, which would silently produce no audio.
          unzip -q -o "$APK" 'lib/arm64-v8a/libbitperfect_engine.so' -d /tmp/apkchk
          NM=$(find "$ANDROID_HOME/ndk" -name llvm-nm | head -1)
          "$NM" -uD /tmp/apkchk/lib/arm64-v8a/libbitperfect_engine.so | grep -q 'ioctl'
          echo "usbdevfs transport compiled in: OK"

      - name: Rename APK with commit for traceability
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/BitPerfect-debug-arm64-${GITHUB_SHA::7}.apk"
          sha256sum dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitPerfect-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Attach APK to release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
